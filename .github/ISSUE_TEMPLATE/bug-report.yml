name: Bug report
description: Something in the reference implementation or tooling behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a suspected vulnerability, stop and read SECURITY.md instead. Do not
        file security issues publicly.

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands or code. Synthetic values only, never a real key or seed.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
    validations:
      required: true
