name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Node 24.19.0
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install and verify pinned npm
        run: |
          npm install --global npm@11.17.0
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:ci
      - name: Conformance vectors
        run: node cli.mjs verify

  cli:
    name: Command line tool
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install and verify pinned npm
        run: |
          npm install --global npm@11.17.0
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
      - run: npm ci
      - run: npm run build
      - name: Exercise the command line tool
        run: node scripts/check-cli.mjs
      - name: Examples run clean
        run: node examples/quickstart.mjs

  boundary:
    name: Public boundary check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install and verify pinned npm
        run: |
          npm install --global npm@11.17.0
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
      - name: Reject internal-only material
        run: node scripts/check-public-boundary.mjs
