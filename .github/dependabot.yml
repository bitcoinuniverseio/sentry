version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # ts-jest currently accepts TypeScript <6; lift this bound only with a
    # coordinated TypeScript/ts-jest migration.
    ignore:
      - dependency-name: typescript
        versions: ['>=6.0.0']
    commit-message:
      prefix: deps
    groups:
      development:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      codeql:
        patterns:
          - github/codeql-action/*
    commit-message:
      prefix: ci
